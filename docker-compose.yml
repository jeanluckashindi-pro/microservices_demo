# ============================================================
# DOCKER COMPOSE - Orchestration locale des microservices
# Démarre tous les services avec une seule commande : docker compose up
# ============================================================
version: '3.8'

services:

  # --------------------------------------------------------
  # BASE DE DONNÉES : une instance PostgreSQL unique
  # avec 3 bases de données initialisées via un script.
  # --------------------------------------------------------
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # La DB par défaut (les 2 autres sont créées par init-db.sh)
      POSTGRES_DB: users_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # USER SERVICE (port 8000)
  # --------------------------------------------------------
  user-service:
    build: ./user_service
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=users_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=user-service-secret-key-change-in-prod
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --------------------------------------------------------
  # VOTE SERVICE (port 8001)
  # --------------------------------------------------------
  vote-service:
    build: ./vote_service
    ports:
      - "8001:8001"
    environment:
      - DB_NAME=votes_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=vote-service-secret-key-change-in-prod
      - DEBUG=True
      - USER_SERVICE_URL=http://user-service:8000
      - NOTIFICATION_SERVICE_URL=http://notification-service:8002
    depends_on:
      db:
        condition: service_healthy
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/admin/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --------------------------------------------------------
  # NOTIFICATION SERVICE (port 8002)
  # --------------------------------------------------------
  notification-service:
    build: ./notification_service
    ports:
      - "8002:8002"
    environment:
      - DB_NAME=notifications_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=notification-service-secret-key-change-in-prod
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    networks:
      - microservices_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/admin/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --------------------------------------------------------
  # PGADMIN (optionnel - outil de gestion PostgreSQL)
  # Accès : http://localhost:5050 (admin@admin.com / admin)
  # --------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - microservices_net
    profiles:
      - debug  # Ne démarre que si : docker compose --profile debug up

volumes:
  postgres_data:

networks:
  microservices_net:
    driver: bridge

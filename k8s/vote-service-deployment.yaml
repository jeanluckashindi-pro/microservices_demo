# ============================================================
# KUBERNETES - Vote Service
# Deployment (2 replicas) + Service ClusterIP
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vote-service
  template:
    metadata:
      labels:
        app: vote-service
    spec:
      containers:
      - name: vote-service
        image: microservices-demo/vote-service:latest
        ports:
        - containerPort: 8001
        env:
        - name: DB_NAME
          value: votes_db
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: DB_USER
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: DB_PORT
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: DB_PASSWORD
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: VOTE_SERVICE_SECRET_KEY
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: DEBUG
        - name: USER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: USER_SERVICE_URL
        - name: NOTIFICATION_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: NOTIFICATION_SERVICE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: vote-service
  namespace: default
spec:
  selector:
    app: vote-service
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP

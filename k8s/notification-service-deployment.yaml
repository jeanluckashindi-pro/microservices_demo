# ============================================================
# KUBERNETES - Notification Service
# Deployment (2 replicas) + Service ClusterIP
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: microservices-demo/notification-service:latest
        ports:
        - containerPort: 8002
        env:
        - name: DB_NAME
          value: notifications_db
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: DB_USER
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: DB_PORT
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: DB_PASSWORD
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: NOTIFICATION_SERVICE_SECRET_KEY
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: DEBUG
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: default
spec:
  selector:
    app: notification-service
  ports:
  - port: 8002
    targetPort: 8002
  type: ClusterIP

# ============================================================
# KUBERNETES - User Service
# Deployment (2 replicas) + Service ClusterIP
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: microservices-demo/user-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: DB_NAME
          value: users_db
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: DB_USER
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: DB_PORT
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: DB_PASSWORD
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: USER_SERVICE_SECRET_KEY
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: DEBUG
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: default
spec:
  selector:
    app: user-service
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
